<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="stylesheet" href="./src/fonts.css" title="Fonts" />
    <link rel="icon" href="./favicon.ico" />
    <script src="./shopmusic.js" defer></script>
    <script src="./src/core.js" defer></script>
    <title>VJDY Official Music Store</title>
  </head>

  <body>
    <nav>
      <div class="nav_layout">
        <span>
          <button
            type="button"
            class="back-button"
            onclick="
              history.length > 1
                ? history.back()
                : (window.location.href = window.location.origin)
            ">
            <img
              src="./assets/icons/arrow_back.svg"
              class="tint"
              alt="Instagram" />
          </button>
          <img
            alt="Logo"
            src="./assets/logo/music.svg"
            height="32px"
            style="cursor: pointer; -webkit-user-drag: auto"
            onclick="window.location.href = window.location.origin" />
        </span>
        <span>
          <input
            id="MUSICSEARCH_BOX"
            type="search"
            placeholder="Search music title, artist, album, year or tag..."
            oninput="API_MUSICSEARCH()" />
          <select id="API_MUSIC_CATEGORY" onchange="API_MUSICFETCH()">
            <option value="2026">2026 Music</option>
            <option value="2025">2025 Music</option>
            <option value="2024">2024 Music</option>
            <option value="2023">2023 Music</option>
            <option value="2022">2022 Music</option>
          </select>
        </span>
      </div>

      <div class="player">
        <audio id="music_player" src=""></audio>
        <div class="player_layout">
          <div height="100%" src="" alt="album" id="artwork"></div>
          <div>
            <span>
              <button id="AUDIOPLAYER_PLAYBTN" class="back-button">
                <img
                  src="./assets/icons/play_arrow.svg"
                  class="tint"
                  id="AUDIOPLAYER_ICON"
                  alt="Instagram" />
              </button>
              <input
                type="range"
                min="0"
                max="100"
                step="0.001"
                id="AUDIOPLAYER_SLIDER"
                style="width: 100%" />
              <select id="VJDY_SELECTSPEED_OPTION">
                <option value="0.5">Slow</option>
                <option value="0.67">0.67x</option>
                <option value="0.70">0.7x</option>
                <option value="0.75">0.75x</option>
                <option value="0.80">0.8x</option>
                <option value="0.90">0.9x</option>
                <option selected value="1">Normal</option>
                <option value="1.1">1.1x</option>
                <option value="1.2">1.2x</option>
                <option value="1.25">1.25x</option>
                <option value="1.33">1.33x</option>
                <option value="1.50">1.5x</option>
                <option value="1.6">1.6x</option>
                <option value="1.8">1.8x</option>
                <option value="2">Fast</option>
              </select>
            </span>
            <hr>
            <span>
              <div>
                <h3 id="AUDIOPLAYER_TITLE">No Title</h3>
                <small id="AUDIOPLAYER_SUB">No Title</small>
              </div>
              <button id="AUDIOPLAYER_DOWNLOAD" class="back-button">
                <img
                  src="./assets/icons/download.svg"
                  class="tint"
                  id="AUDIOPLAYER_ICON"
                  alt="Instagram" />
              </button>
            </span>
          </div>
        </div>
      </div>
    </nav>
    <header>
      <div class="MNS_AREA_1">
        <h2>Open source AI-powered and own composition of music for all!</h2>
      </div>
    </header>

    <main id="music_parent">
      <table id="tablex"></table>
    </main>

    <footer>
      <script src="src/footer.js"></script>
    </footer>
  </body>
</html>
