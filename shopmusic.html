<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="stylesheet" href="./src/fonts.css" title="Fonts" />
    <link rel="icon" href="./favicon.ico">
    <script src="./shopmusic.js" defer></script>
    <title>VJDY Official Music Store</title>
  </head>

  <body>
    <audio id="music_player"></audio>
    <nav>
      <div class="nav_layout">
        <span>
          <button
            type="button"
            class="back-button"
            onclick="
              history.length > 1
                ? history.back()
                : (window.location.href = window.location.origin)
            ">
            <img
              src="./assets/icons/arrow_back.svg"
              class="tint"
              alt="Instagram" />
          </button>
          <img
            alt="Logo"
            src="./assets/logo/music.svg"
            height="32px"
            style="cursor: pointer; -webkit-user-drag: auto"
            onclick="window.location.href = window.location.origin" />
        </span>
        <span>
          <input
            id="MUSICSEARCH_BOX"
            type="search"
            placeholder="Search music title, artist, album, year or tag..."
            oninput="API_MUSICSEARCH()" />
          <select id="API_MUSIC_CATEGORY" onchange="API_MUSICFETCH();">
            <option value="2026">2026 Music</option>
            <option value="2025">2025 Music</option>
            <option value="2024">2024 Music</option>
            <option value="2023">2023 Music</option>
            <option value="2022">2022 Music</option>
          </select>
        </span>
      </div>
    </nav>
    <header>
      <div class="MNS_AREA_1">
        <h2>Open source AI-powered and own composition of music for all!</h2>
      </div>
    </header>

    <main id="music_parent">
      <table id="tablex"></table>
    </main>

    <main class="player">
      <span>
        <button id="AUDIOPLAYER_PLAYBTN" class="back-button">
          <img
            src="./assets/icons/play_arrow.svg"
            class="tint"
            id="AUDIOPLAYER_ICON"
            alt="Instagram" />
        </button>
        <input
          type="range"
          min="0"
          max="100"
          step="0.001"
          id="AUDIOPLAYER_SLIDER"
          style="width: 100%" />
      </span>
      <span>
        <div>
          <h3 id="AUDIOPLAYER_TITLE">No Title</h3>
          <small id="AUDIOPLAYER_SUB">No Title</small>
        </div>
        <button id="AUDIOPLAYER_DOWNLOAD" class="back-button">
          <img
            src="./assets/icons/download.svg"
            class="tint"
            id="AUDIOPLAYER_ICON"
            alt="Instagram" />
        </button>
      </span>
    </main>

    <footer>
      <script src="src/footer.js"></script>
    </footer>
  </body>
</html>
